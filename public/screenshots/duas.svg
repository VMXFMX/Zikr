    <text x="466" y="132" text-anchor="start" fill="#ffffff" font-family="Amiri Quran, Amiri, serif" font-size="25" font-weight="700">رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا</text>
