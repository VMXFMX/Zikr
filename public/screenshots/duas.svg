    <text x="444" y="284" text-anchor="start" fill="#9cb3a8" font-family="IBM Plex Sans Arabic, sans-serif" font-size="15">📋 نسخ</text>
    <text x="330" y="284" text-anchor="start" fill="#9cb3a8" font-family="IBM Plex Sans Arabic, sans-serif" font-size="15">🔗 مشاركة</text>
