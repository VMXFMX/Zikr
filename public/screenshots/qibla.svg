  <line x1="86" y1="488" x2="104" y2="488" stroke="#28cc88" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="270" y1="654" x2="270" y2="672" stroke="#28cc88" stroke-width="3.5" stroke-linecap="round"/>

