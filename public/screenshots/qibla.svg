    <text x="462" y="238" text-anchor="start" fill="#28cc88" font-family="IBM Plex Sans Arabic, sans-serif" font-size="18.5" font-weight="700">عالية</text>
    <text x="26" y="208" text-anchor="end" fill="#8ea69b" font-family="IBM Plex Sans Arabic, sans-serif" font-size="13.5">المسافة إلى الكعبة المشرفة</text>
    <text x="26" y="238" text-anchor="end" fill="#ffffff" font-family="IBM Plex Sans Arabic, sans-serif" font-size="18.5" font-weight="700">١٥٢٢ كم</text>
  </g>

  
