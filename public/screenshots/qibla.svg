  <text x="270" y="120" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans Arabic, sans-serif" font-size="14.5" font-weight="600">🎯 Worabe  <tspan fill="#8ea69b">•  مكة المكرمة / الكعبة 🕋 (١٥٢٢ كم)</tspan></text>

