    <!-- Fonts: Plus Jakarta Sans (Latin), IBM Plex Sans Arabic & Amiri (Arabic), Noto Sans Ethiopic (Amharic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-flash Theme & Language Initialization -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('zikr-theme');
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var resolvedTheme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : prefersLight
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolvedTheme);
          root.setAttribute('data-theme', resolvedTheme);

          var savedLang = localStorage.getItem('zikr-lang');
          var resolvedLang =
            savedLang === 'ar' || savedLang === 'en' || savedLang === 'am' ? savedLang : 'ar';
          root.lang = resolvedLang;
          root.dir = resolvedLang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ZIKR",
        "inLanguage": ["ar", "en", "am"],
        "description": "The official website for ZIKR, an Islamic remembrance application designed with simplicity, clarity, and calm visual focus."
      }
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-500/20 selection:text-emerald-400">
